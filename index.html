function Dialog({title,children,onClose,wide=false}){
 const ref=useRef(),close=useRef(onClose);close.current=onClose;
 useEffect(()=>{
  const prev=document.activeElement,overflow=document.body.style.overflow;document.body.style.overflow="hidden";
  const t=setTimeout(()=>ref.current?.querySelector("input,textarea,select,button")?.focus(),30);
  const handler=e=>{
   if(e.key==="Escape")close.current();
   if(e.key!=="Tab")return;
   const list=[...ref.current.querySelectorAll("button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href],summary")].filter(n=>n.offsetParent!==null);
   if(!list.length)return;
   if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list[list.length-1].focus();}
   else if(!e.shiftKey&&document.activeElement===list[list.length-1]){e.preventDefault();list[0].focus();}
  };
  window.addEventListener("keydown",handler);
  return()=>{clearTimeout(t);document.body.style.overflow=overflow;window.removeEventListener("keydown",handler);prev?.focus();};
 },[]);
 return <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/35 p-3 md:p-6" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}><section ref={ref} role="dialog" aria-modal="true" aria-labelledby="dialog-title" className={`max-h-[92dvh] w-full overflow-y-auto rounded-2xl bg-white p-5 shadow-xl md:p-6 ${wide?"max-w-5xl":"max-w-xl"}`}><div className="mb-5 flex items-center justify-between gap-3"><h2 id="dialog-title" className="text-lg font-semibold">{title}</h2><button type="button" aria-label="닫기" className="rounded-lg p-2 hover:bg-paper" onClick={onClose}><X className="h-5 w-5"/></button></div>{children}</section></div>;

const SYNC_SQL=`
create table if not exists public.gyomusil_rooms(
 code_hash text primary key,payload jsonb not null,
 version bigint not null default 1,updated_at timestamptz not null default now());
alter table public.gyomusil_rooms enable row level security;
revoke all on public.gyomusil_rooms from anon,authenticated;
create or replace function public.gyomusil_create(p_code text,p_data jsonb)
returns jsonb language plpgsql security definer set search_path=public,pg_temp as $$
begin
 if p_code is null or p_code !~ '^[0-9a-f]{64}$' then raise exception '잘못된 코드'; end if;
 if p_data is null or octet_length(p_data::text)>3000000 then raise exception '최대 3MB'; end if;
 insert into public.gyomusil_rooms(code_hash,payload) values(encode(sha256(convert_to(p_code,'UTF8')),'hex'),p_data);
 return jsonb_build_object('version',1);
end $$;
create or replace function public.gyomusil_read(p_code text)
returns jsonb language plpgsql security definer set search_path=public,pg_temp as $$
declare r public.gyomusil_rooms;
begin
 if p_code is null or p_code !~ '^[0-9a-f]{64}$' then raise exception '잘못된 코드'; end if;
 select * into r from public.gyomusil_rooms where code_hash=encode(sha256(convert_to(p_code,'UTF8')),'hex');
 if not found then raise exception '공간 없음'; end if;
 return jsonb_build_object('version',r.version,'data',r.payload);
end $$;
create or replace function public.gyomusil_write(p_code text,p_version bigint,p_data jsonb)
returns jsonb language plpgsql security definer set search_path=public,pg_temp as $$
declare n bigint;
begin
 if p_code is null or p_code !~ '^[0-9a-f]{64}$' then raise exception '잘못된 코드'; end if;
 if p_data is null or octet_length(p_data::text)>3000000 then raise exception '최대 3MB'; end if;
 update public.gyomusil_rooms set payload=p_data,version=version+1,updated_at=now()
 where code_hash=encode(sha256(convert_to(p_code,'UTF8')),'hex') and version=p_version returning version into n;
 if n is null then return jsonb_build_object('conflict',true); end if;
 return jsonb_build_object('version',n);
end $$;
revoke all on function public.gyomusil_create(text,jsonb) from public;
revoke all on function public.gyomusil_read(text) from public;
revoke all on function public.gyomusil_write(text,bigint,p_data jsonb) from public;
grant execute on function public.gyomusil_create(text,jsonb) to anon,authenticated;
grant execute on function public.gyomusil_read(text) to anon,authenticated;
grant execute on function public.gyomusil_write(text,bigint,jsonb) to anon,authenticated;
`.trim();

 // [매일 문해력] 1~5문단(1500~2000자) 가변 보정기 & '문해력_창고' 폴더 연동 함수
 // ============================================================================
 function sanitizeNewsContent(raw, fallbackDate) {
  const c = isObj(raw?.content) ? raw.content : (isObj(raw) ? raw : {});
  const str = (v, d) => hasText(v) ? String(v).trim() : d;

  // 1~5문단 가변 유지 (비어 있으면 기본 1문단 생성, 5문단 초과 시 5문단까지만 수용)
  const rawParas = Array.isArray(c.paragraphs) ? c.paragraphs.map(x => str(x, "")).filter(Boolean) : [];
  const paragraphs = (rawParas.length ? rawParas : ["본문 문단 내용을 확인하세요."]).slice(0, 5);
  const pLen = paragraphs.length;

  const rawNotes = Array.isArray(c.paragraphNotes) ? c.paragraphNotes.map(x => str(x, "")).filter(Boolean) : [];
  const paragraphNotes = Array.from({ length: pLen }, (_, i) => rawNotes[i] || `${i + 1}문단 핵심 중심 생각`);

  const vocabRaw = Array.isArray(c.vocabulary) ? c.vocabulary : [];
  const vocabulary = vocabRaw.map((w, i) => ({
   word: str(w?.word, `핵심어휘 ${i + 1}`),
   hanja: str(w?.hanja, "해당 없음"),
   part: str(w?.part, "명사"),
   definition: str(w?.definition, "문맥 속 의미를 파악해 보세요."),
   context: str(w?.context, "지문에서 사용된 문맥적 의미"),
   example: str(w?.example, "실생활 적용 예시 문장")
  })).slice(0, 8);
  while (vocabulary.length < 4) {
   const idx = vocabulary.length + 1;
   vocabulary.push({ word: `보충어휘 ${idx}`, hanja: "해당 없음", part: "명사", definition: "지문에서 주요 개념어를 찾아 뜻을 적어 보세요.", context: "본문 문맥 참고", example: "예문을 직접 만들어 보세요." });
  }
  const mcqRaw = Array.isArray(c.multipleChoice) ? c.multipleChoice : [];
  const multipleChoice = [0, 1].map(i => {
   const q = mcqRaw[i] || {};
   const opts = Array.isArray(q.options) ? q.options.map((o, j) => str(o, `선택지 ${j + 1}`)) : [];
   while (opts.length < 4) opts.push(`선택지 ${opts.length + 1}`);
   const ans = Number(q.answer);
   return {
    type: str(q.type, i === 0 ? "사실적 이해" : "추론적·비판적 이해"),
    question: str(q.question, `지문의 핵심 내용과 관련하여 물음에 답하시오. (문항 ${i + 1})`),
    options: opts.slice(0, 4),
    answer: Number.isInteger(ans) && ans >= 1 && ans <= 4 ? ans : 1,
    explanation: str(q.explanation, "본문 근거를 바탕으로 정답과 오답의 이유를 확인하세요."),
    evidence: str(q.evidence, `${Math.min(i + 1, pLen)}문단 참조`),
    intent: str(q.intent, "핵심 논지 및 세부 정보 파악")
   };
  });
  const w = isObj(c.written) ? c.written : {};
  const written = {
   question: str(w.question, "이 글의 핵심 쟁점에 대한 자신의 입장을 본문 근거를 들어 서술하시오."),
   hint: str(w.hint, "핵심 개념어를 포함하여 두 문장 이상으로 작성하세요."),
   sample: str(w.sample, "제시문의 논거를 바탕으로 자신의 관점과 대안을 구체적으로 서술한 예시 답안입니다."),
   criteria: Array.isArray(w.criteria) && w.criteria.length ? w.criteria.map(x => str(x, "핵심 개념 활용")) : ["핵심 개념어 포함 여부", "본문 근거와의 논리적 연결성"],
   evidence: str(w.evidence, "본문 전체 논지")
  };
  return {
   title: str(c.title, "시사 문해력 탐구 활동지"),
   newsTitle: str(c.newsTitle, str(c.title, "원기사 제목")),
   publisher: str(c.publisher, "시사·학술 매체"),
   articleDate: validDate(c.articleDate) ? c.articleDate : fallbackDate,
   selectionReason: str(c.selectionReason, "고등학교 교과 연계 및 심화 독해력 함양을 위해 선정한 주제입니다."),
   paragraphs,
   concepts: Array.isArray(c.concepts) && c.concepts.length ? c.concepts.map(x => str(x, "핵심개념")) : ["비판적 읽기", "시사 쟁점"],
   paragraphNotes,
   logic: str(c.logic, "문제 제기 → 핵심 원리 및 쟁점 분석 → 다각적 검토 및 시사점 도출"),
   vocabulary,
   multipleChoice,
   written,
   summary: str(c.summary, str(paragraphs[0], "핵심 요약 내용입니다.")),
   teacherNote: str(c.teacherNote, "학생들이 지문의 근거를 찾아 자신의 언어로 재구성하도록 지도해 주세요."),
   warnings: Array.isArray(c.warnings) && c.warnings.length ? c.warnings.map(x => str(x, "사실관계 및 시점 확인")) : ["수업 배포 전 기사 발행일과 최신 통계를 확인하세요."]
  };
 }

 async function fetchFromDrive(silent = false) {
  const targetUrl = gasUrl.trim();
  if(!targetUrl) {
   if(!silent) { setShowDriveConfig(true); setError("구글 앱스 스크립트 웹 앱 URL을 먼저 입력해 주세요."); }
   return;
  }
  setBusy("구글 드라이브 '문해력_창고' 폴더에서 활동지를 동기화하는 중입니다...");
  setError("");
  try {
   const sep = targetUrl.includes("?") ? "&" : "?";
   const r = await fetch(`${targetUrl}${sep}t=${Date.now()}`, { method: "GET", redirect: "follow" });
   if(!r.ok) throw Error(`서버 응답 오류 (HTTP ${r.status})`);
   const v = await r.json();
   if(v.error) throw Error(v.error);
   if(!Array.isArray(v.items)) throw Error("올바른 활동지 목록 형식(items 배열)이 아닙니다.");

   const existingMap = new Map((live.current.liveLiteracy?.items || []).map(x => [x.id, x]));
   const parsedItems = [];

   for(const item of v.items) {
    if(!isObj(item)) continue;
    const rawName = String(item.name || "").replace(/\.json$/i, "").trim();
    const parts = rawName.split("_").map(s => s.trim());

    let itemDate = day();
    const dateMatch = (parts[0] || "").match(/^(\d{4})[-.]?(\d{2})[-.]?(\d{2})$/);
    if(dateMatch) {
     const dStr = `${dateMatch[1]}-${dateMatch[2]}-${dateMatch[3]}`;
     if(validDate(dStr)) itemDate = dStr;
    } else if(validDate(item.date)) {
     itemDate = item.date;
    } else if(validDate(item.content?.articleDate)) {
     itemDate = item.content.articleDate;
    }

    const foundLevel = parts.find(p => LEVELS.includes(p)) || (LEVELS.includes(item.level) ? item.level : (LEVELS.includes(item.content?.level) ? item.content.level : "고등"));
    const foundCat = parts.find(p => CATEGORIES.includes(p)) || item.category || item.content?.category || parts[3] || "사회";

    const cleanContent = sanitizeNewsContent(item.content || item, itemDate);
    if(parts[1] && cleanContent.title === "시사 문해력 탐구 활동지") cleanContent.title = parts[1];
    if(!valid("news", cleanContent)) continue;

    const id = String(item.id || rawName || uid());
    const prev = existingMap.get(id);
    const rawSources = Array.isArray(item.sources) ? item.sources : (Array.isArray(item.content?.sources) ? item.content.sources : []);
    const cleanSources = rawSources.filter(s => isObj(s) && safeURL(s.url)).map(s => ({ title: hasText(s.title) ? s.title : "원문·참고 링크", url: safeURL(s.url) }));

    parsedItems.push({
     id,
     fileName: item.name || `${itemDate}_${cleanContent.title}_${foundLevel}_${foundCat}.json`,
     date: itemDate,
     level: foundLevel,
     category: foundCat,
     range: { start: itemDate, end: itemDate },
     content: cleanContent,
     sources: cleanSources,
     checks: prev && Array.isArray(prev.checks) && prev.checks.length === 4 ? prev.checks : [false, false, false, false],
     model: item.model || "Gemini (문해력_창고 연동)"
    });
   }

   parsedItems.sort((a, b) => (b.date + b.fileName).localeCompare(a.date + a.fileName));
   update(d => ({ ...d, liveLiteracy: { items: parsedItems } }));
   localStorage.setItem("gyomusil-gas-url", targetUrl);
   setShowDriveConfig(false);
   if(!silent) notify(`'문해력_창고' 폴더에서 총 ${parsedItems.length}편의 활동지를 불러왔습니다.`);
  } catch(e) {
   if(!silent) setError("드라이브 연결 실패: " + e.message);
  } finally {
   setBusy("");
  }
 }

  if(!Number.isInteger(s.sessions)||s.sessions<1||s.sessions>12||!Number.isInteger(s.minutes)||s.minutes<20||s.minutes>120){setError("차시 1~12, 시간 20~120분으로 설정하세요.");return;}
  if(kind==="analysis"&&(!pdf||!pdfConsent)){setStep(0);setError("PDF와 전송 동의를 확인하세요.");return;}
  if(kind!=="analysis"&&!lesson){setStep(1);setError("단원을 분석하고 차시를 선택하세요.");return;}
  if(!["analysis","plan"].includes(kind)&&!out.plan){setStep(2);setError("개념기반 과정안을 먼저 생성하세요. 활동지·슬라이드·평가는 해당 과정안에 맞춰 생성합니다.");return;}
  if(kind==="quiz"){const ns=["quizOx","quizMcq","quizInitial","quizShort"].map(k=>s[k]);if(ns.some(n=>!Number.isInteger(n)||n<0||n>8)||!ns.some(n=>n>0)){setError("유형별 0~8개, 전체 1문항 이상 설정하세요.");return;}}
  if((kind==="analysis"&&analysis||out[kind])&&!confirm("추가 사용량이 발생합니다. 단원 재분석은 전체 차시 자료를, 과정안 재생성은 이 차시의 후속 자료를 초기화합니다. 계속할까요?"))return;
  const lid=studio.selectedId;
  run(kind,async(signal,current)=>{
   const {value:v}=await gemini(studioPrompt(kind),kind,signal,{attachPDF:!!pdf&&pdfConsent&&["analysis","plan"].includes(kind)});if(!current())return;
   if(kind==="analysis"&&v.lessons.length!==s.sessions)throw Error("차시 수가 설정과 다릅니다.");
   if(kind==="analysis"&&(!v.macro.length||!v.micro.length||!hasText(v.generalization)))throw Error("개념·일반화 분석이 부족하여 저장하지 않았습니다.");
   if(kind==="plan"){
    if(v.intro_time+v.dev_time+v.conc_time!==s.minutes)throw Error("수업 시간 합계가 설정과 다릅니다.");
    if(["macro","micro","objective","big_idea","intro_act","dev_act","conc_act","transfer","assessment"].some(k=>!hasText(v[k]))||QUESTIONS.some(([k])=>!v.questions[k].length))throw Error("개념기반 설계의 필수 항목이 누락되어 저장하지 않았습니다.");
   }
   if(kind==="worksheet"&&["act1_title","act1_desc","act2_title","act2_desc","act3_title","act3_desc","wrap_up","teacherGuide"].some(k=>!hasText(v[k])))throw Error("활동지의 탐구·전이·교사용 도움말이 누락되어 저장하지 않았습니다.");
   if(kind==="quiz")for(const [k,n] of [["ox_quiz",s.quizOx],["mcq",s.quizMcq],["initial_quiz",s.quizInitial],["vocab_quiz",s.quizShort]])if(v[k].length!==n)throw Error("문항 수가 설정과 다릅니다.");
   update(d=>{const st=d.studio;return {...d,studio:kind==="analysis"?{...st,analysis:v,selectedId:v.lessons[0].id,byLesson:{}}:{...st,byLesson:{...st.byLesson,[lid]:kind==="plan"?{plan:v}:{...st.byLesson[lid],[kind]:v}}}};});
   notify(kind==="plan"?"개념기반 과정안을 생성했습니다. 목표·활동·전이·평가의 연결을 검토하세요.":kind==="worksheet"?"과정안에 맞춘 탐구 활동지를 생성했습니다. 학생용 문항과 교사용 도움말을 확인하세요.":"생성했습니다. 교사 검토 후 사용하세요.");
  });
 }
 async function readPDF(file){
  if(!file)return;const id=++fileSeq.current;setFileBusy(true);setPdf(null);setPdfConsent(false);
  try{
   if(file.size>12*1024*1024)throw Error("PDF는 12MB 이하만 지원합니다.");
   const bytes=new Uint8Array(await file.arrayBuffer());if(!new TextDecoder().decode(bytes.slice(0,1024)).includes("%PDF-"))throw Error("유효한 PDF가 아닙니다.");
   let binary="";for(let i=0;i<bytes.length;i+=32768)binary+=String.fromCharCode(...bytes.subarray(i,i+32768));
   if(id===fileSeq.current)setPdf({name:file.name,base64:btoa(binary)});
  }catch(e){setError(e.message);}finally{if(id===fileSeq.current)setFileBusy(false);}
 }

  try{if(file.size>15*1024*1024)throw Error("15MB 이하 백업을 선택하세요.");setModal({type:"restore",value:normalize(JSON.parse(await file.text()))});}catch(e){notify(e.message);}

 async function rpc(c,name,args){
  const a=new AbortController(),t=setTimeout(()=>a.abort(),20000);
  try{const r=await fetch(c.url+"/rest/v1/rpc/gyomusil_"+name,{method:"POST",headers:{apikey:c.key,"Content-Type":"application/json"},body:JSON.stringify(args),signal:a.signal});const v=await r.json();if(!r.ok)throw Error(v.message||"서버 설정을 확인하세요.");return v;}finally{clearTimeout(t);}
 }
 async function connect(create){
  if(cloudBusy||syncLock.current||aiLock.current)return;setCloudBusy(true);setCloudError("");
  try{
   const u=new URL(cloudURL.trim()),key=cloudKey.trim();
   if(u.protocol!=="https:"||!u.hostname.endsWith(".supabase.co"))throw Error("Supabase HTTPS 프로젝트 URL을 입력하세요.");
   if(!key||key.startsWith("sb_secret_"))throw Error("공개 키만 사용할 수 있습니다.");
   if(key.split(".").length===3){let claims;try{const p=key.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");claims=JSON.parse(atob(p.padEnd(Math.ceil(p.length/4)*4,"=")));}catch{}if(claims?.role==="service_role")throw Error("service_role 비밀 키는 사용하지 마세요.");}
   let secret=code.trim().toLowerCase();
   if(create){const b=new Uint8Array(32);crypto.getRandomValues(b);secret=Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");}
   if(!/^[0-9a-f]{64}$/.test(secret))throw Error("64자리 연결 코드를 입력하세요.");
   if(!create&&!confirm("현재 기기 자료를 서버 자료로 바꿉니다. 백업했나요?"))return;
   const c={url:u.origin,key,code:secret,version:0,last:"",active:true};
   if(create){
    const serialized=JSON.stringify(live.current);if(new Blob([serialized]).size>2900000)throw Error("동기화 자료는 약 3MB 이하여야 합니다.");
    const r=await rpc(c,"create",{p_code:secret,p_data:live.current});c.version=r.version;c.last=serialized;
   }else{const r=await rpc(c,"read",{p_code:secret}),v=normalize(r.data);c.version=r.version;c.last=JSON.stringify(v);live.current=v;setData(v);}
   cloud.current=c;setConnected(true);setConflict(false);setCode(secret);setCloudStatus("연결됨 · 자동 동기화");
   try{localStorage.setItem("gyomusil-cloud-config",JSON.stringify({url:c.url,key}));}catch{}
  }catch(e){setCloudError(e.message);}finally{setCloudBusy(false);}
 }
 async function syncTick(){
  const c=cloud.current;if(!c?.active||c.conflict||syncLock.current||aiLock.current)return;syncLock.current=true;
  try{
   const serialized=JSON.stringify(live.current);
   if(serialized!==c.last){
    if(Date.now()-editTime.current<1200)return;
    if(new Blob([serialized]).size>2900000)throw Error("동기화 용량 초과입니다. 백업 후 자료를 줄이세요.");
    const r=await rpc(c,"write",{p_code:c.code,p_version:c.version,p_data:live.current});if(cloud.current!==c)return;
    if(r.conflict){c.conflict=true;setConflict(true);setCloudStatus("동시 수정 확인 필요");return;}c.version=r.version;c.last=serialized;
   }else{
    const r=await rpc(c,"read",{p_code:c.code});if(cloud.current!==c)return;
    if(r.version!==c.version){if(aiLock.current||JSON.stringify(live.current)!==c.last)return;const v=normalize(r.data);c.version=r.version;c.last=JSON.stringify(v);live.current=v;setData(v);}
   }
   setCloudStatus("최신 상태 · 연결됨");setCloudError("");
  }catch(e){if(cloud.current===c){setCloudStatus("연결 확인 필요 · 로컬 보관");setCloudError(e.message);}}
  finally{syncLock.current=false;}
 }
 async function resolveConflict(){
  const c=cloud.current;if(!c||cloudBusy||aiLock.current)return;
  if(!confirm("내 자료를 백업한 뒤 서버 최신 자료로 교체할까요?"))return;setCloudBusy(true);
  try{download("교무실_충돌전_백업.json",JSON.stringify(live.current,null,2),"application/json");const r=await rpc(c,"read",{p_code:c.code}),v=normalize(r.data);if(cloud.current!==c)return;c.version=r.version;c.last=JSON.stringify(v);c.conflict=false;live.current=v;setData(v);setConflict(false);setCloudStatus("서버 자료로 갱신됨");}
  catch(e){setCloudError(e.message);}finally{setCloudBusy(false);}
 }

  {modal.kind==="task"?<Field label="중요도" id="record-priority"><select id="record-priority" name="priority" className={INPUT} defaultValue={modal.value?.priority||"보통"}>{["높음","보통","낮음"].map(x=><option key={x}>{x}</option>)}</select></Field>:modal.kind==="note"?<Field label="상담 대상" id="record-target"><select id="record-target" name="target" className={INPUT} defaultValue={modal.value?.target||"학생"}><option>학생</option><option>학부모</option></select></Field>:<Field label="시간" id="record-time"><input id="record-time" required type="time" name="time" className={INPUT} defaultValue={modal.value?.time||"15:30"}/></Field>}</div>
  {["task","event"].includes(modal.kind)&&<Field label="분류" id="record-category"><select id="record-category" name="category" className={INPUT} defaultValue={modal.value?.category||(modal.kind==="task"?"수업 준비":"수업")}>{(modal.kind==="task"?["학급 운영","수업 준비","평가·기록","행정 업무"]:["학급","수업","상담","행정"]).map(x=><option key={x}>{x}</option>)}</select></Field>}
  {modal.kind==="training"&&<Field label="장소" id="record-location"><input id="record-location" required name="location" className={INPUT} defaultValue={modal.value?.location||""}/></Field>}
  {modal.kind==="note"&&<><Field label="학생 익명 식별자" id="record-student"><input id="record-student" required name="student" className={INPUT} defaultValue={modal.value?.student||""}/></Field><Field label="상담 내용·후속 조치" id="record-body"><textarea id="record-body" required name="body" rows="5" className={INPUT} defaultValue={modal.value?.body||""}/></Field></>}
  <div className="flex justify-end gap-2"><Button onClick={()=>setModal(null)}>취소</Button><button type="submit" className="min-h-[44px] rounded-lg bg-brand px-5 text-sm text-white">저장하기</button></div>
 </form></Dialog>}

 {modal?.type==="roster"&&<Dialog title="학생 명렬 수정" onClose={()=>setModal(null)}><form className="space-y-4" onSubmit={e=>{
  e.preventDefault();const names=e.currentTarget.elements.names.value.split("\n").map(x=>x.trim()).filter(Boolean);
  if(!names.length||names.length>60){notify("1~60명까지 입력하세요.");return;}
  if(new Set(names).size!==names.length){notify("동명이인은 구분 표기를 추가하세요.");return;}
  if(!confirm("줄 순서대로 번호를 부여합니다. 이름 변경은 새 학생으로 처리합니다. 적용할까요?"))return;
  update(d=>({...d,students:names.map((name,i)=>{const old=d.students.find(s=>s.name===name);return old?{...old,number:i+1}:{id:uid(),name,number:i+1,submitted:false};})}));setModal(null);
 }}><Field label="이름을 한 줄에 한 명씩 입력하세요" id="roster-names"><textarea id="roster-names" name="names" rows="14" className={INPUT} defaultValue={data.students.map(s=>s.name).join("\n")}/></Field><Note>같은 이름의 기존 기록은 유지합니다. 변경 전 백업을 권장합니다.</Note><button type="submit" className="min-h-[44px] w-full rounded-lg bg-brand text-sm text-white">명렬 적용</button></form></Dialog>}

 {["delete","deleteNews"].includes(modal?.type)&&<Dialog title="기록을 삭제할까요?" onClose={()=>setModal(null)}><Note error>삭제하면 복구할 수 없습니다. 연결된 기기에도 반영됩니다. 필요한 경우 먼저 백업하세요.</Note><div className="mt-5 flex justify-end gap-2"><Button onClick={()=>setModal(null)}>취소</Button><Button primary onClick={()=>{if(modal.type==="deleteNews")update(d=>({...d,liveLiteracy:{items:d.liveLiteracy.items.filter(n=>n.id!==modal.id)}}));else update(d=>({...d,[modal.key]:d[modal.key].filter(x=>x.id!==modal.id)}));setModal(null);}}>삭제</Button></div></Dialog>}
 {modal?.type==="restore"&&<Dialog title="백업을 복원할까요?" onClose={()=>setModal(null)}><Note error>현재 자료를 백업 내용으로 교체합니다. 연결 중이면 다른 기기에도 반영됩니다.</Note><div className="mt-5 flex justify-end gap-2"><Button onClick={()=>setModal(null)}>취소</Button><Button primary disabled={!!busy} onClick={()=>{blocked.current=false;update(modal.value);setModal(null);notify("백업을 복원했습니다.");}}>교체·복원</Button></div></Dialog>}

 {modal?.type==="editStudy"&&data.studio.byLesson[modal.id]?.[modal.kind]&&<Dialog title={NAMES[modal.kind]+" 수정"} wide onClose={()=>setModal(null)}><Note>JSON 항목 이름과 구조는 유지하세요. 과정안 수정 시 이 차시의 슬라이드·활동지·평가를 초기화하여 다시 설계하도록 합니다. 생성 전후 자료는 먼저 백업할 수 있습니다.</Note><div className="mt-4"><TextEditor disabled={!!busy} value={JSON.stringify(data.studio.byLesson[modal.id][modal.kind],null,2)} onSave={value=>{
  try{
   const parsed=JSON.parse(value),kind=modal.kind,lid=modal.id;
   if(!valid(kind,parsed))throw Error("필수 구조와 형식을 유지하세요.");
   if(kind==="plan"&&parsed.intro_time+parsed.dev_time+parsed.conc_time!==s.minutes)throw Error("도입·전개·정리 시간 합계를 설정한 수업 시간과 맞춰 주세요.");
   if(kind==="plan"&&!confirm("과정안을 수정하고 이 차시의 후속 자료를 초기화할까요?"))return false;
   update(d=>({...d,studio:{...d.studio,byLesson:{...d.studio.byLesson,[lid]:kind==="plan"?{plan:parsed}:{...d.studio.byLesson[lid],[kind]:parsed}}}}));notify("수정 내용을 저장했습니다.");return true;
  }catch(e){notify(e.message);return false;}
 }}/></div></Dialog>}

 {modal?.type==="news"&&selectedNews&&<Dialog title="문해력 탐구 활동지" wide onClose={()=>setModal(null)}><NewsDetail item={selectedNews} onCheck={(i,value)=>update(d=>({...d,liveLiteracy:{items:d.liveLiteracy.items.map(n=>n.id===selectedNews.id?{...n,checks:n.checks.map((x,j)=>i===j?value:x)}:n)}}))} onPrint={print} onEdit={()=>setModal({type:"editNews",id:selectedNews.id})}/><div className="mt-5 flex flex-wrap gap-2 border-t border-line pt-4"><Button onClick={()=>download("문해력_"+selectedNews.date+".json",JSON.stringify(selectedNews,null,2),"application/json")}>이 자료 JSON 저장</Button><Button onClick={()=>copy(selectedNews.content.paragraphs.join("\n\n")).then(()=>notify("지문을 복사했습니다.")).catch(e=>notify(e.message))}>지문 복사</Button></div></Dialog>}
 {modal?.type==="editNews"&&selectedNews&&<Dialog title="활동지 내용 수정" wide onClose={()=>setModal({type:"news",id:selectedNews.id})}><Note>항목 이름과 배열 구조를 유지하세요(1~5문단 허용, paragraphs와 paragraphNotes의 개수 일치 필요). 저장하면 교사 확인 체크를 초기화합니다.</Note><div className="mt-4"><TextEditor value={JSON.stringify(selectedNews.content,null,2)} onSave={value=>{try{const c=JSON.parse(value);if(!valid("news",c))throw Error("필수 구조(1~5문단 및 논지 개수 일치, 객관식 2문항 등)를 유지하세요.");update(d=>({...d,liveLiteracy:{items:d.liveLiteracy.items.map(n=>n.id===selectedNews.id?{...n,content:c,checks:[false,false,false,false]}:n)}}));notify("수정했습니다. 최초 검색 근거가 수정 내용의 정확성을 보증하지는 않습니다.");return true;}catch(e){notify(e.message);return false;}}}/></div><Button className="mt-4" onClick={()=>setModal({type:"news",id:selectedNews.id})}>활동지로 돌아가기</Button></Dialog>}

 {modal?.type==="print"&&<Dialog title="자료 인쇄 미리보기" wide onClose={()=>setModal(null)}><div className="mb-4 flex flex-wrap gap-2"><Button primary disabled={!printReady} onClick={()=>{try{frameRef.current.contentWindow.focus();frameRef.current.contentWindow.print();}catch{notify("HTML을 내려받아 브라우저에서 열고 ⌘P를 누르세요.");}}}><Monitor className="h-4 w-4"/>인쇄 / PDF 저장</Button><Button onClick={()=>download("교무실_인쇄자료.html",printHTML,"text/html;charset=utf-8")}><Download className="h-4 w-4"/>인쇄용 HTML</Button></div><p className="mb-4 text-xs leading-7 text-slate-500">맥: 인쇄 창의 PDF 메뉴에서 저장하세요. 모바일: 기기의 인쇄·공유 기능을 사용하세요. 인쇄가 제한되면 HTML을 내려받아 브라우저에서 연 뒤 인쇄하세요.</p><iframe ref={frameRef} title="인쇄용 자료 미리보기" srcDoc={printHTML} onLoad={()=>setPrintReady(true)} sandbox="allow-same-origin allow-modals" className="h-[60dvh] w-full rounded-lg border border-line bg-white"/></Dialog>}

 {modal?.type==="sync"&&<Dialog title="컴퓨터와 휴대폰 연결" wide={showSQL} onClose={()=>setModal(null)}><div className="space-y-5">
  <Note>같은 Supabase 프로젝트와 연결 코드로 기록을 공유합니다. API 키·원본 PDF는 제외합니다. 서버 설치 없이 로컬 기능은 사용할 수 있습니다.</Note>
  <div className="grid gap-4 md:grid-cols-2"><Field label="Supabase 프로젝트 URL" id="cloud-url"><input id="cloud-url" type="url" className={INPUT} value={cloudURL} disabled={connected||cloudBusy} onChange={e=>setCloudURL(e.target.value)} placeholder="https://프로젝트.supabase.co"/></Field><Field label="publishable / anon 공개 키" id="cloud-key"><input id="cloud-key" className={INPUT} value={cloudKey} disabled={connected||cloudBusy} onChange={e=>setCloudKey(e.target.value)} autoComplete="off"/></Field></div>
  <Field label="64자리 연결 코드 · 비밀번호처럼 보관" id="cloud-code"><textarea id="cloud-code" rows="2" className={INPUT+" break-all font-mono !text-xs"} value={code} disabled={connected||cloudBusy} onChange={e=>setCode(e.target.value.trim())}/></Field>
  {cloudError&&<Note error>{cloudError}</Note>}
  {connected?<><p aria-live="polite" className="text-xs text-brand">{cloudStatus}</p><div className="flex flex-wrap gap-2"><Button onClick={()=>copy(code).then(()=>notify("코드를 복사했습니다.")).catch(e=>notify(e.message))}>코드 복사</Button><Button disabled={cloudBusy||!!busy||conflict} onClick={syncTick}>지금 동기화</Button><Button disabled={cloudBusy} onClick={()=>{if(cloud.current)cloud.current.active=false;cloud.current=null;setConnected(false);setConflict(false);setCloudStatus("이 기기에 저장");setCloudError("");}}>연결 해제</Button></div>{conflict&&<Note error>동시 수정은 자동 병합하지 않습니다.<div className="mt-3"><Button disabled={cloudBusy||!!busy} onClick={resolveConflict}>내 자료 백업 후 서버 자료 불러오기</Button></div></Note>}</>:<div className="flex flex-wrap gap-2"><Button primary disabled={cloudBusy||!!busy} onClick={()=>connect(true)}>{cloudBusy&&<Loader2 className="h-4 w-4 animate-spin"/>}현재 자료로 공간 만들기</Button><Button disabled={cloudBusy||!!busy} onClick={()=>connect(false)}>기존 코드로 연결</Button></div>}
  <p className="text-xs leading-7 text-slate-500">약 3초 간격 확인·약 3MB 지원. URL·공개 키만 기기에 저장합니다. 새로고침 후 연결 코드는 다시 입력하세요. 연결 해제는 서버 삭제가 아닙니다.</p>
  <Button onClick={()=>setShowSQL(!showSQL)}>서버 설치 안내 {showSQL?"접기":"보기"}</Button>
  {showSQL&&<div className="space-y-4"><ol className="list-decimal space-y-3 pl-5 text-sm leading-7 text-slate-600"><li>Supabase 프로젝트를 만들고 SQL Editor에서 아래 SQL을 실행하세요.</li><li>프로젝트 URL과 publishable 또는 anon 공개 키를 입력하세요. service_role·secret 키는 금지합니다.</li><li>원본 자료가 있는 컴퓨터에서 공간을 만들고 연결 코드를 보관하세요.</li><li>휴대폰에서도 같은 HTML을 HTTPS 주소로 열고 같은 프로젝트·공개 키·연결 코드를 입력하세요.</li><li>localhost는 각 기기 자신을 뜻합니다. 휴대폰에서 컴퓨터의 localhost 주소를 그대로 열 수 없습니다.</li></ol><Note error>코드를 아는 사람이 기록에 접근하는 개인용 방식입니다. 사용자 로그인·권한 분리·요청 제한은 포함하지 않습니다. 실제 학생·상담·서명 정보를 클라우드에 저장하려면 학교 정책에 맞는 인증과 개인정보 보호 설계가 필요합니다.</Note><div className="flex gap-2"><Button onClick={()=>copy(SYNC_SQL).then(()=>notify("SQL을 복사했습니다.")).catch(e=>notify(e.message))}>SQL 복사</Button><Button onClick={()=>download("교무실_서버설치.sql",SYNC_SQL)}>SQL 다운로드</Button></div><textarea aria-label="서버 설치 SQL" readOnly rows="14" className={INPUT+" font-mono !text-xs"} value={SYNC_SQL}/><Note>기존 Streamlit의 JSON·CSV 파일과 자동으로 연결되지는 않습니다. 서버 기록 삭제는 Supabase의 gyomusil_rooms 테이블에서 수행하세요.</Note></div>}
 </div></Dialog>}

 {toast&&<div role="status" aria-live="polite" className="fixed bottom-5 left-1/2 z-[70] flex w-[calc(100%-32px)] max-w-md -translate-x-1/2 items-start gap-2 rounded-xl bg-[#302847] px-4 py-3 text-xs leading-6 text-white shadow-lg"><CheckCircle className="mt-1 h-4 w-4 shrink-0"/><span className="min-w-0 flex-1">{toast}</span><button type="button" aria-label="알림 닫기" onClick={()=>setToast("")} className="p-1"><X className="h-4 w-4"/></button></div>}
 </div>;
}

class ErrorBoundary extends React.Component{
 constructor(props){super(props);this.state={error:null};}
 static getDerivedStateFromError(error){return {error};}
 render(){
  if(this.state.error)return <main className="mx-auto max-w-xl px-6 py-16"><h1 className="text-xl font-bold">화면 구성 중 오류가 발생했습니다.</h1><p className="mt-4 text-sm leading-7 text-slate-600">저장 자료를 지우지 말고 원본부터 백업하세요. 아래 문구를 알려주시면 원인 확인에 도움이 됩니다.</p><pre className="mt-4 rounded-lg border border-red-200 bg-red-50 p-4 text-xs text-red-800">{String(this.state.error.message||this.state.error)}</pre><div className="mt-5 flex flex-wrap gap-2"><Button onClick={()=>{try{download("교무실_원본저장자료.json",localStorage.getItem(STORE)||"{}","application/json");}catch{alert("저장소에 접근하지 못했습니다.");}}}>원본 자료 다운로드</Button><Button primary onClick={()=>location.reload()}>새로고침</Button></div></main>;
  return this.props.children;
 }
}
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><App/></ErrorBoundary>);
</script>
